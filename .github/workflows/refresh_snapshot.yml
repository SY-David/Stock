name: Refresh Site Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "18 7 * * 1-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh_snapshot.yml"
      - "app_config.py"
      - "refresh_snapshot.py"
      - "requirements.txt"
      - "modules/**"
      - "tests/**"
      - "tools/**"

permissions:
  contents: write

concurrency:
  group: refresh-site-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run maintenance pipeline with diagnostics
        shell: bash
        run: |
          mkdir -p data
          : > data/ci_diagnostic.log
          rm -f data/ci_failed

          run_step() {
            local label="$1"
            shift
            echo "===== ${label} =====" | tee -a data/ci_diagnostic.log
            "$@" >> data/ci_diagnostic.log 2>&1
            local code=$?
            echo "exit=${code}" | tee -a data/ci_diagnostic.log
            echo | tee -a data/ci_diagnostic.log
            if [ "$code" -ne 0 ]; then
              touch data/ci_failed
            fi
            return 0
          }

          set +e
          run_step "restore_full_history" python tools/restore_full_history.py
          run_step "rebuild_snapshot_history" python tools/rebuild_snapshot_history.py
          run_step "optimize_streamlit_app" python -c "from tools.optimize_streamlit_app import optimize_app; optimize_app()"
          run_step "fix_history_cache" python tools/fix_history_cache.py
          run_step "fix_repo_audit" python tools/fix_repo_audit.py
          run_step "fix_portfolio_tracking" python tools/fix_portfolio_tracking.py
          run_step "unit_tests" python -m unittest discover -s tests
          cat data/ci_diagnostic.log

      - name: Refresh snapshot
        id: refresh
        continue-on-error: true
        run: python refresh_snapshot.py --no-prompt

      - name: Commit generated files and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py app_config.py README.md
          git add modules/analysis_service.py modules/paper_trading.py
          git add modules/scoring_engine.py modules/site_snapshot.py modules/storage.py
          git add data/site_snapshot.json data/history data/update_status.json
          git add data/ci_diagnostic.log
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: apply audit fixes and refresh snapshot"
          git push

      - name: Mark failed maintenance or refresh
        if: always()
        run: |
          if [ -f data/ci_failed ] || [ "${{ steps.refresh.outcome }}" = "failure" ]; then
            exit 1
          fi
