name: Refresh Site Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "18 7 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "app_config.py"
      - "refresh_snapshot.py"
      - "requirements.txt"
      - "modules/analysis_service.py"
      - "modules/candidate_pool.py"
      - "modules/scoring_engine.py"
      - "modules/site_snapshot.py"
      - "modules/paper_trading.py"
      - "tools/optimize_streamlit_app.py"
      - "tools/restore_full_history.py"
      - "tools/rebuild_snapshot_history.py"

permissions:
  contents: write

concurrency:
  group: refresh-site-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Restore complete history behavior
        run: python tools/restore_full_history.py

      - name: Rebuild compact history from Git
        run: python tools/rebuild_snapshot_history.py

      - name: Optimize Streamlit app
        run: python tools/optimize_streamlit_app.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Refresh snapshot
        id: refresh
        continue-on-error: true
        run: python refresh_snapshot.py --no-prompt

      - name: Commit optimized app, complete history, snapshot, and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git add modules/paper_trading.py
          git add modules/site_snapshot.py
          git add data/site_snapshot.json
          git add data/history
          git add data/update_status.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: restore complete history and refresh snapshot"
          git push

      - name: Mark failed refresh
        if: steps.refresh.outcome == 'failure'
        run: exit 1
